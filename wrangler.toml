name = "route-mapper-sg"
main = "worker/src/index.ts"
compatibility_date = "2026-11-01"

# Daily keep-alive for Supabase's free tier plus purge of old reports and feedback.
[triggers]
crons = ["17 3 * * *"]

[vars]
# Comma-separated origins allowed to call the API (localhost is always allowed for development).
ALLOWED_ORIGINS = "https://route-mapper-app.routemappersg.workers.dev"
ORS_DAILY_CAP = "400"

# Secrets are NOT set here. Add them with `wrangler secret put` or in the dashboard:
# ONEMAP_EMAIL, ONEMAP_PASSWORD, ORS_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_KEY, ADMIN_TOKEN, HASH_SALT

# Preview builds (any branch other than main) run `wrangler preview`, which needs its own values.
# Safe placeholders: a preview has no secrets, calls nothing real, and allows no routing quota.
[previews.vars]
ALLOWED_ORIGINS = "https://preview.invalid"
ORS_DAILY_CAP = "0"
